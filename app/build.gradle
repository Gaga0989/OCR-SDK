plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-android-extensions'
    id 'com.google.firebase.crashlytics'
}

android {
    compileSdk 34 // 31, 34

    defaultConfig {
        applicationId "com.css.ocrsdk"
        minSdk 28 // 26
        targetSdk 34 // 31, 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        viewBinding true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    lintOptions {
        abortOnError false
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-common:18.0.0'
    implementation 'androidx.annotation:annotation:1.2.0'
    implementation 'com.google.firebase:firebase-messaging:20.1.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    implementation 'com.karumi:dexter:6.2.1'
    implementation 'com.github.addisonelliott:SegmentedButton:3.1.9'
    // ping
    //implementation "com.marsounjan:icmp4a:1.0.0"
    // pdf
    //implementation 'com.github.barteksc:android-pdf-viewer:2.8.2'
    // firebase
    implementation platform('com.google.firebase:firebase-bom:31.2.3')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-messaging-ktx:23.1.2'
    //implementation 'com.google.firebase:firebase-inappmessaging-display:21.0.0'
    // lifecycle
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.5.1"
    // koin
    implementation "org.koin:koin-android-viewmodel:2.1.6"
    implementation "org.koin:koin-android:2.1.6"
    // QR Scan
    implementation 'me.dm7.barcodescanner:zxing:1.9.13'
    implementation 'com.budiyev.android:code-scanner:2.1.0' //2.1.0
    // firebase
    //implementation 'com.google.firebase:firebase-core:21.1.1:'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:18.0.2'
    // chucker
    debugImplementation "com.github.chuckerteam.chucker:library:3.5.0"
    releaseImplementation "com.github.chuckerteam.chucker:library-no-op:3.5.0"
    // chart
    implementation 'com.github.PhilJay:MPAndroidChart:v2.2.4'
    // glide
    implementation 'com.github.bumptech.glide:glide:4.15.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.0'
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.25'
    // camera
    def camerax_version = '1.3.4'//'1.3.0'//'1.0.0-beta07'
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    //implementation 'androidx.camera:camera-view:1.0.0-alpha14'
    // ** To Solve Duplicate problem
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0") { //org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0") { //org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }
    // OCR Primary
    //implementation 'com.regula.documentreader.core:fullrfid:6.9.+@aar' // old
    /*implementation 'com.regula.documentreader.core:ocrandmrz:+@aar'
    implementation('com.regula.documentreader:api:6.9.+@aar') {
        transitive = true;
    }*/
    implementation project(':ocr-scanner')
    // connection
    implementation 'com.squareup.okhttp3:okhttp:4.11.0' //'com.squareup.okhttp3:okhttp:4.9.0'
    implementation 'com.google.okhttp:okhttp:20120626'
    implementation "com.squareup.okhttp3:logging-interceptor:4.7.2"
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation 'com.squareup.retrofit2:converter-gson:2.5.0'
}
apply plugin: 'com.android.application'